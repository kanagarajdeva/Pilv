plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.pilv.chat'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.pilv.chat"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit

    // 🔥 FIREBASE
    implementation platform('com.google.firebase:firebase-bom:33.0.0')
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-auth'

    // 📍 Location (Android built-in - No extra dependency needed)
    // We'll use Android's LocationManager instead of Google Play Services
}

// Apply Google Services plugin at the bottom
apply plugin: 'com.google.gms.google-services'